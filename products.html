<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Bake Delight</title>
    <meta name="description" content="Explore our menu of Cakes, Cookies, and Pastries.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Bake Delight</a>
            <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li>
                    <div class="cart-icon" onclick="openCart()">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count">0</span>
                    </div>
                </li>
            </ul>
        </nav>
        <div class="header-drip"></div>
    </header>

    <main>
        <section class="section">
            <h1 class="section-title">Our Menu</h1>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="All">All Delights</button>
                <button class="filter-btn" data-filter="Cakes">Rich Cakes</button>
                <button class="filter-btn" data-filter="Cookies">Gourmet Cookies</button>
                <button class="filter-btn" data-filter="Pastries">Fresh Pastries</button>
                <button class="filter-btn" data-filter="Other Delights">Other Delights</button>
            </div>

            <div class="products-grid" id="allProductsGrid">
                <!-- Products dynamically inserted via JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <p>&copy; 2026 Bake Delight. All Rights Reserved.</p>
            </div>
            <div class="footer-center">
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                </div>
            </div>
            <div class="footer-right">
                <a href="https://wa.me/923295431127" target="_blank" class="wa-chat-btn">
                    <i class="fab fa-whatsapp"></i> Chat with Us
                </a>
            </div>
        </div>
    </footer>

    <!-- Cart Modal -->
    <div id="cartModal" class="cart-modal">
        <div class="cart-content">
            <button id="closeCart" class="close-cart"><i class="fas fa-times"></i></button>
            <h2>Your Cart</h2>
            <div id="cartItems" class="cart-items"></div>
            <div id="cartTotal" class="cart-total">Total: Rs. 0.00</div>
            
            <form id="checkoutForm" onsubmit="processCheckout(event)">
                <div class="form-group">
                    <label for="customerName">Name</label>
                    <input type="text" id="customerName" required>
                </div>
                <div class="form-group">
                    <label for="customerPhone">Phone Number</label>
                    <input type="tel" id="customerPhone" required>
                </div>
                <div class="form-group">
                    <label for="deliveryTime">Delivery Date & Time (Requires 24hr Notice)</label>
                    <input type="datetime-local" id="deliveryTime" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Checkout via WhatsApp</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
